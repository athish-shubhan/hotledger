# Apache Kafka (KRaft, single node), Postgres 16 and Redis 7 for running the
# lab on a laptop. NOT exercised in the environment that produced results/
# (no container registry access there); the built-in kfake broker was used.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   ./bin/hotledger run -design kafka -brokers localhost:9092 ...
#
# pg-restart with Docker:
#   export HOTLEDGER_PG_STOP="docker compose -f deploy/docker-compose.yml kill -s SIGKILL postgres"
#   export HOTLEDGER_PG_START="docker compose -f deploy/docker-compose.yml start postgres"
services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  postgres:
    image: postgres:16
    command: postgres -c max_connections=200
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotledger
